- category: Internship
  question: What did you work on during your first-year internship at Nangoku Soft?
  answer: |
    Last year, I completed an internship in Japan that lasted about two and a half months. After returning to the United States, I continued contributing remotely.

    My primary responsibility was front-end development. At the time, I had very little professional development experience, so I learned my way through UI implementation and JavaScript feature development as I went.

    One challenge was that I had not yet developed the habit of making use of existing technologies and tools. For example, I sometimes measured a screen with a ruler to set padding for layout adjustments, or built JavaScript logic from scratch without first researching libraries or established implementations. This occasionally led me to reinvent the wheel.

    At the same time, I developed the ability to research independently and keep moving forward even when much was unfamiliar. I gained experience in experimenting, learning by doing, and seeing tasks through to completion.

    The internship also had relatively well-defined tasks, so much of the work centered on implementing requirements. As a result, there were fewer opportunities to think deeply about user experience or product-wide design.

    My biggest takeaway was the importance of building a working version quickly. Turning an MVP into something tangible in a short period and iterating on it was a valuable experience. AI will make many technical tasks more efficient, but learning by building in a real development environment has meaningfully shaped how I think about my work.

    Going forward, I want to go beyond implementing features and also focus on designing comfortable, thoughtful user experiences. Building on the development fundamentals I gained last year, I aim to become an engineer who creates better product experiences.

