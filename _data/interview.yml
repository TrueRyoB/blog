- category: インターン
  question: 初年度の南国ソフトさんでの取り組み
  answer: |
    昨年、約2か月半にわたり日本でインターンに参加し、その後もアメリカへ戻ってからオンラインで継続して業務に携わらせていただいた。

    主な担当はフロントエンド開発を中心とした下流工程だった。当時は実務開発の経験がほとんどなく、UI実装やJavaScriptによる機能開発を手探りで進めていた。

    特に課題だったのは、「既に存在する技術やツールを活用する」という発想が不足していたことだ。例えば、レイアウト調整のために画面上で定規を使って採寸しながらpaddingを決めたり、ライブラリや既存実装を調査せずにJavaScriptのロジックをゼロから作成したりすることもあった。結果として、いわゆる「車輪の再発明」をしてしまった場面も少なくなかった。

    一方で、分からないことが多い環境でも自分で調査しながら開発を進める力は身についたと感じている。与えられたタスクを完了させるために試行錯誤を重ね、実際に手を動かしながら学ぶ経験を積むことができた。

    また、このインターンでは比較的明確にタスクが定義されており、要件に沿って実装を進めることが中心だった。そのため、ユーザー体験やプロダクト全体の設計を深く考える機会は多くなかったと感じている。

    その中で得られた最大の学びは、「まず動くものを素早く作る」ことの重要性だった。短期間でMVP（Minimum Viable Product）を形にし、検証を進める開発プロセスを経験できたことは大きな収穫だった。技術そのものは今後AIによって効率化されていく部分も多いが、実際に開発の現場で手を動かしながら学んだ経験は、自分の考え方や仕事への向き合い方を大きく変えるきっかけになった。

    今後は、単に機能を実装するだけでなく、「ユーザーにとって心地よいUXをどう設計するか」という視点にも取り組みたいと考えている。昨年の経験で得た開発基礎を土台として、より良いプロダクト体験を作れるエンジニアを目指したい。

