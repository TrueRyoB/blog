title: "true's blog"
description: "Technical insights from a university student's perspective"
url: "https://TrueRyoB.github.io"
baseurl: "/blog"
author:
  name: "true"
  email: "trueryob@proton.me"

lang: en
timezone: Asia/Tokyo

markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true

# Plugins
plugins:
  - jekyll-seo-tag

# Sass
sass:
  sass_dir: _sass
  style: compressed

# Exclude
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - README.md
  - vendor

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
