{% assign words = include.content | number_of_words %}
{% if words < 100 %}
  {% assign reading_time = 1 %}
{% elsif words < 200 %}
  {% assign reading_time = 2 %}
{% else %}
  {% assign reading_time = words | divided_by: 500 | plus: 1 %}
{% endif %}
<span class="reading-time">{{ reading_time }} min read</span>
