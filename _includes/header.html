<header class="site-header">
  <div class="header-inner">
    <a class="site-title" href="{{ site.baseurl }}/">{{ site.title }}</a>

    <div class="header-right">
      <nav class="site-nav" aria-label="メインナビゲーション">
        <a href="{{ site.baseurl }}/" {% if page.url == "/" %}class="active"{% endif %}>Home</a>
        <a href="{{ site.baseurl }}/archive" {% if page.url contains "/archive" %}class="active"{% endif %}>Archive</a>
        <a href="{{ site.baseurl }}/tags" {% if page.url contains "/tags" %}class="active"{% endif %}>Tags</a>
        <a href="{{ site.baseurl }}/interview" {% if page.url contains "/interview" %}class="active"{% endif %}>FAQ</a>
        <a href="{{ site.baseurl }}/about" {% if page.url contains "/about" %}class="active"{% endif %}>About</a>
      </nav>

      <div class="header-controls">
        <a href="{{ site.baseurl }}/search" class="search-link" aria-label="検索" {% if page.url contains "/search" %}class="active"{% endif %}>

            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </a>
        <button id="dark-mode-toggle" class="theme-toggle" aria-label="ダークモード切替" title="ダークモード切替">
          <span class="icon-sun" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
          </span>
          <span class="icon-moon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </span>
        </button>

        <button id="nav-toggle" class="nav-toggle" aria-expanded="false" aria-label="メニューを開く" aria-controls="nav-mobile-menu">
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
        </button>
      </div>
    </div>
  </div>
</header>

<div class="nav-mobile-menu" id="nav-mobile-menu" aria-hidden="true">
  <nav aria-label="モバイルナビゲーション">
    <a href="{{ site.baseurl }}/" {% if page.url == "/" %}class="active"{% endif %}>Home</a>
    <a href="{{ site.baseurl }}/archive" {% if page.url contains "/archive" %}class="active"{% endif %}>Archive</a>
    <a href="{{ site.baseurl }}/tags" {% if page.url contains "/tags" %}class="active"{% endif %}>Tags</a>
    <a href="{{ site.baseurl }}/interview" {% if page.url contains "/interview" %}class="active"{% endif %}>FAQ</a>
    <a href="{{ site.baseurl }}/about" {% if page.url contains "/about" %}class="active"{% endif %}>About</a>
    <a href="{{ site.baseurl }}/search" {% if page.url contains "/search" %}class="active"{% endif %}>Search</a>
  </nav>
</div>
<div class="nav-backdrop" id="nav-backdrop" aria-hidden="true"></div>

<script src="{{ site.baseurl }}/assets/js/dark-mode.js"></script>
